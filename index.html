<!DOCTYPE html>
<html lang="en">
<head>
    <title>Index</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="text-align: center; font-family: Garamond, serif;">
        <div class="iconBox">
            <!-- A <p> element is a block element, so it takes up the entire line by itself. That's why:-->
            <!-- <span> is an inline element -->
            <span style="font: bold;">Suwira</span>
            <div>
                <a href="products.html">products</a>
                <a href="profile.html">profile</a>
                <a href="contact.html">contact</a>
            </div>
        </div>
        <div id="todolisBox">
            <div style="margin:10px">
                <input type="text" placeholder="Please enter todolist" id="item">
                <button type="submit" id="submit">Add</button>
            </div>
            <div id="todolist" style="text-align: left; padding-left: 0px; display:block"></div>
            <!--To tell your <ul> tag to stop using its built-in browser padding and start right 
                at the edge of the container, add padding-left: 0; to its styles.-->
        </div>
    </div>
    <script>
        const addButton = document.getElementById("submit")
        addButton.addEventListener("click",function(){
            const itemValue = document.getElementById("item").value;
            const todolist = document.getElementById("todolist");
                /*
                const ele = document.createElement("p");
                ele.innerHTML = item
                const list = document.getElementById("todolist");
                list.appendChild(ele)
                */
            if(item != ""){
                // create div to add text & button
                const block = document.createElement("div");
                block.style.margin = "0px";
                block.style.display = "flex";
                block.style.justifyContent = "space-between";
                block.style.alignItems = "center";

                // create text & button
                const text = document.createElement("p"); // p is paragraph
                const removeButton = document.createElement("button");
                removeButton.innerHTML = "remove";
                removeButton.style.padding = "0px 0px";
                
                text.innerHTML = itemValue;

                removeButton.addEventListener("click",function(){
                    block.remove();
                })

                block.appendChild(text);
                block.appendChild(removeButton);

                todolist.appendChild(block);
            }
        })
    </script>
</body>
</html>
